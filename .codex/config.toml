[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
enabled = true
startup_timeout_sec = 30

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]
enabled = true
startup_timeout_sec = 30

[mcp_servers.docker]
command = "uvx"
args = ["docker-mcp-server"]
enabled = false

disabled_tools = [
  "container_exec",
  "container_remove",
  "container_prune",
  "image_prune",
  "volume_remove",
  "volume_prune",
  "compose_down",
  "stack_deploy",
  "system_login",
  "secret_create"
]


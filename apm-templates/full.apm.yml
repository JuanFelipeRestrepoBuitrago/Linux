# full.apm.yml — whole-package APM consumer manifest
#
# Pulls the ENTIRE JuanFelipeRestrepoBuitrago/Linux package via the owner/repo
# shorthand: all instructions, all agents, all skills, all hooks, and all 8
# MCP servers declared in the package's apm.yml dependencies.mcp.
#
# Usage: drop this file into a consumer project as its apm.yml, then run:
#   apm install
# Pin to a tag/branch/commit for reproducibility, e.g.:
#   - JuanFelipeRestrepoBuitrago/Linux#v1.0.0
name: full-consumer
version: 0.1.0
description: Whole-package pull — every primitive and all 8 MCP servers from the Linux package.
targets:
  - kiro
dependencies:
  apm:
    # Whole-package shorthand: owner/repo (optionally #ref to pin)
    - JuanFelipeRestrepoBuitrago/Linux

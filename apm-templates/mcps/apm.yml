# mcps.apm.yml — MCP-only APM manifest
#
# All user-configured MCP servers from ~/.kiro/settings/mcp.json, expressed as
# self-defined APM MCP dependencies. No instructions/agents/skills/hooks.
#
# Notes:
#   - disabled / disabledTools have NO modeled APM field; they pass through as
#     extra keys and broadcast to EVERY target (warn at parse time). Kiro honors
#     both; other targets may ignore them. See .agents/apm/research.md §6.
#   - autoApprove: [] (document-loader) equals the default empty allowlist and
#     has no APM equivalent, so it is dropped (no behavior change).
#   - Secrets stay as ${VAR}; Kiro/Copilot resolve at server start. Export
#     GITHUB_PERSONAL_ACCESS_TOKEN and DEFAULT_ENGRAM_PROJECT in your env.
#   - powers.mcpServers.power-context7-context7 is a Kiro *power*, not a user MCP
#     server — out of scope, not packaged.
#
# Usage: drop this file into a consumer project as its apm.yml (or merge the
# dependencies.mcp block into an existing one), then run:
#   apm install --only mcp
name: mcps-consumer
version: 0.1.0
description: All user-configured MCP servers, self-defined for APM install.
targets:
    - kiro
dependencies:
    mcp:
        # docker — stdio, disabled. disabled + disabledTools preserved as passthrough.
        - name: docker
          registry: false
          transport: stdio
          command: uvx
          args:
              - docker-mcp-server
          disabled: true
          disabledTools:
              - buildx_build
              - buildx_bake
              - buildx_imagetools_inspect
              - buildx_imagetools_create
              - buildx_list
              - buildx_history_list
              - buildx_history_inspect
              - buildx_inspect
              - buildx_du
              - buildx_prune
              - buildx_create
              - buildx_use
              - buildx_remove
              - system_ping
              - system_version
              - system_info
              - system_df
              - host_list
              - system_login
              - system_logout
              - system_events
              - system_close
              - system_reconnect
              - compose_list
              - config_create
              - config_inspect
              - config_list
              - config_remove
              - container_inspect
              - container_list
              - container_prune
              - container_start
              - container_pause
              - container_unpause
              - container_logs
              - container_stats
              - container_top
              - container_exec
              - container_commit
              - container_diff
              - container_rename
              - container_update
              - container_wait
              - container_export
              - container_archive_get
              - container_archive_get_to_file
              - container_archive_put
              - context_list
              - context_inspect
              - context_create
              - context_use
              - context_remove
              - image_build
              - image_inspect
              - image_registry_data
              - image_list
              - image_search
              - image_prune
              - image_prune_builds
              - image_load
              - image_history
              - network_create
              - network_inspect
              - network_list
              - network_prune
              - network_remove
              - network_connect
              - network_disconnect
              - node_inspect
              - node_list
              - node_update
              - node_remove
              - node_wait
              - plugin_create
              - plugin_inspect
              - plugin_install
              - plugin_privileges
              - plugin_push
              - plugin_list
              - plugin_configure
              - plugin_disable
              - plugin_enable
              - plugin_remove
              - plugin_upgrade
              - registry_tags
              - registry_tag_wait
              - registry_manifest
              - registry_image_config
              - hub_tags
              - hub_repo_info
              - hub_rate_limit
              - service_create
              - service_inspect
              - service_list
              - service_update
              - service_remove
              - service_ps
              - service_logs
              - service_scale
              - service_rollback
              - service_wait
              - docs_lookup
              - tool_list
              - scout_cves
              - scout_quickview
              - scout_recommendations
              - scout_compare
              - scout_sbom
              - secret_create
              - secret_inspect
              - secret_list
              - secret_remove
              - stack_deploy
              - stack_list
              - stack_ps
              - stack_services
              - stack_remove
              - swarm_init
              - swarm_join
              - swarm_leave
              - swarm_update
              - swarm_inspect
              - swarm_unlock
              - swarm_unlock_key
              - swarm_join_tokens
              - swarm_task_inspect
              - swarm_task_list
              - swarm_task_logs
              - volume_create
              - volume_inspect
              - volume_list
              - volume_prune
              - volume_remove
              - container_create
              - container_run
              - container_stop
              - container_restart
              - container_kill
              - container_remove
              - image_import
              - image_save
              - image_tag
              - compose_unpause
              - compose_pause
              - compose_kill
              - compose_cp
              - compose_top
              - compose_wait
              - compose_port
              - compose_images
              - compose_exec
              - compose_run
              - compose_start
              - compose_stop
              - compose_restart
              - compose_pull
              - compose_build
              - compose_config
              - compose_logs
              - compose_ps
              - compose_down
              - compose_up

        # fetch — stdio, enabled.
        - name: fetch
          registry: false
          transport: stdio
          command: uvx
          args:
              - mcp-server-fetch

        # github — remote HTTP (GitHub Copilot MCP). Token via ${VAR}, enabled.
        - name: github
          registry: false
          transport: http
          url: https://api.githubcopilot.com/mcp/
          headers:
              Authorization: Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}
          disabledTools:
              - add_issue_comment
              - assign_copilot_to_issue
              - create_branch
              - create_or_update_file
              - delete_file
              - get_file_contents
              - get_label
              - get_latest_release
              - get_release_by_tag
              - get_team_members
              - get_teams
              - get_tag
              - delete_repository
              - create_repository
              - fork_repository
              - issue_read
              - issue_write
              - list_branches
              - list_issue_fields
              - list_issues
              - list_issue_types
              - list_releases
              - list_repository_collaborators
              - list_tags
              - request_copilot_review
              - search_issues
              - sub_issue_write
              - update_issue_comment
              - search_commits
              - search_code

        # linkedin — stdio, disabled. UV_HTTP_TIMEOUT is tuning, not a secret.
        - name: linkedin
          registry: false
          transport: stdio
          command: uvx
          args:
              - mcp-server-linkedin@latest
          env:
              UV_HTTP_TIMEOUT: '300'
          disabled: true

        # document-loader — stdio, enabled. Source autoApprove:[] dropped (default).
        - name: document-loader
          registry: false
          transport: stdio
          command: uvx
          args:
              - awslabs.document-loader-mcp-server@latest
          env:
              FASTMCP_LOG_LEVEL: ERROR

        # office-mcp — stdio, enabled. ${HOME} refs resolved by the harness.
        - name: office-mcp
          registry: false
          transport: stdio
          command: ${HOME}/tools/office-mcp/.venv/bin/python
          args:
              - ${HOME}/tools/office-mcp/server.py
          env:
              PYTHONUTF8: '1'
              PYTHONIOENCODING: utf-8
              OFFICE_MCP_DEFAULT_FOLDER: ${HOME}

        # aws-mcp — stdio, disabled.
        - name: aws-mcp
          registry: false
          transport: stdio
          command: uvx
          args:
              - mcp-proxy-for-aws@latest
              - https://aws-mcp.us-east-1.api.aws/mcp
              - --metadata
              - INSTALL_SOURCE=aws-cli
          disabled: true

        # engram — stdio, enabled. Project via ${DEFAULT_ENGRAM_PROJECT}.
        - name: engram
          registry: false
          transport: stdio
          command: engram
          args:
              - mcp
              - --tools=agent
              - --project
              - ${DEFAULT_ENGRAM_PROJECT}
          disabledTools:
              - mem_delete
              - mem_doctor
              - mem_judge
              - mem_compare
              - mem_current_project

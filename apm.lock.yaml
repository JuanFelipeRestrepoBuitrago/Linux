mcp_configs:
  aws-mcp:
    name: aws-mcp
    transport: stdio
    args:
    - mcp-proxy-for-aws@latest
    - https://aws-mcp.us-east-1.api.aws/mcp
    - --metadata
    - INSTALL_SOURCE=aws-cli
    registry: false
    command: uvx
    disabled: true
  docker:
    name: docker
    transport: stdio
    args:
    - docker-mcp-server
    registry: false
    command: uvx
    disabled: true
    disabledTools:

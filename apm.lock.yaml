    - scout_cves
    - scout_quickview
    - scout_recommendations
    - scout_compare
    - scout_sbom
    - secret_create
    - secret_inspect
    - secret_list
    - secret_remove
    - stack_deploy
    - stack_list
    - stack_ps
    - stack_services
    - stack_remove
    - swarm_init
    - swarm_join
    - swarm_leave
    - swarm_update
    - swarm_inspect
    - swarm_unlock
    - swarm_unlock_key
    - swarm_join_tokens
    - swarm_task_inspect
    - swarm_task_list
    - swarm_task_logs
    - volume_create
    - volume_inspect
    - volume_list
    - volume_prune
    - volume_remove
    - container_create
    - container_run
    - container_stop
    - container_restart
    - container_kill
    - container_remove
    - image_import

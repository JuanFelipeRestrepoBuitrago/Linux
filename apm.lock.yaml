    - compose_build
    - compose_config
    - compose_logs
    - compose_ps
    - compose_down
    - compose_up
  document-loader:
    name: document-loader
    transport: stdio
    env:
      FASTMCP_LOG_LEVEL: ERROR
    args:
    - awslabs.document-loader-mcp-server@latest
    registry: false
    command: uvx
  engram:
    name: engram
    transport: stdio
    args:
    - mcp
    - --tools=agent
    - --project
    - personal-configurations
    registry: false
    command: /home/pipas/.local/bin/engram
    disabledTools:
    - mem_delete
    - mem_doctor
    - mem_judge
    - mem_compare
    - mem_current_project
  fetch:
    name: fetch
    transport: stdio
    args:
    - mcp-server-fetch
    registry: false
    command: uvx
  github-personal:
    name: github-personal
    transport: stdio
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
    args:
    - run
    - -i
    - --rm
    - -e
    - GITHUB_PERSONAL_ACCESS_TOKEN
    - ghcr.io/github/github-mcp-server
    - stdio
    registry: false
    command: docker
    disabledTools:
    - add_issue_comment
    - assign_copilot_to_issue
    - create_branch
    - create_or_update_file
    - delete_file
    - get_file_contents
    - get_label
    - get_latest_release
    - get_release_by_tag
    - get_team_members
    - get_teams
    - get_tag
    - delete_repository
    - create_repository
    - fork_repository
    - issue_read
    - issue_write
    - list_branches
    - list_issue_fields
    - list_issues
    - list_issue_types
    - list_releases
    - list_repository_collaborators
    - list_tags
    - request_copilot_review
    - search_issues
    - sub_issue_write
    - update_issue_comment
    - search_commits
    - search_code
  linkedin:
    name: linkedin
    transport: stdio
    env:
      UV_HTTP_TIMEOUT: '300'
    args:
    - mcp-server-linkedin@latest
    registry: false
    command: uvx
    disabled: true
  office-mcp:
    name: office-mcp
    transport: stdio
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OFFICE_MCP_DEFAULT_FOLDER: /home/pipas
    args:
    - /home/pipas/tools/office-mcp/server.py
    registry: false
    command: /home/pipas/tools/office-mcp/.venv/bin/python
    disabled: true

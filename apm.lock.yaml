    - context_list
    - context_inspect
    - context_create
    - context_use
    - context_remove
    - image_build
    - image_inspect
    - image_registry_data
    - image_list
    - image_search
    - image_prune
    - image_prune_builds
    - image_load
    - image_history
    - network_create
    - network_inspect
    - network_list
    - network_prune
    - network_remove
    - network_connect
    - network_disconnect
    - node_inspect
    - node_list
    - node_update
    - node_remove
    - node_wait
    - plugin_create
    - plugin_inspect
    - plugin_install
    - plugin_privileges
    - plugin_push
    - plugin_list
    - plugin_configure
    - plugin_disable
    - plugin_enable
    - plugin_remove
    - plugin_upgrade
    - registry_tags
    - registry_tag_wait
    - registry_manifest
    - registry_image_config
    - hub_tags
    - hub_repo_info
    - hub_rate_limit
    - service_create

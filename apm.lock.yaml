lockfile_version: '1'
apm_version: 0.35.0
dependencies: []
deployments:
- kind: uri
  target: mcp
  value: engram
  runtime: kiro
  scope: project
  owners:
  - .
  active_owner: .
  content_hash: null
mcp_servers:
- engram
mcp_configs:
  engram:
    name: engram
    transport: stdio
    args:
    - mcp
    - --tools=agent
    - --project
    - personal-configurations
    registry: false
    command: engram
    disabledTools:
    - mem_delete
    - mem_doctor
    - mem_judge
    - mem_compare
    - mem_current_project
mcp_target_servers:
  kiro:
  - engram

name: personal-configurations
version: 1.0.0
description: Global Kiro configuration package — steering, agents, skills, hooks and MCP servers.
targets:
    - kiro
    - claude
    - codex
dependencies:
    mcp:
        - name: engram
          registry: false
          transport: stdio
          command: engram
          args:
              - mcp
              - --tools=agent
              - --project
              - personal-configurations
          disabledTools:
              - mem_delete
              - mem_doctor
              - mem_judge
              - mem_compare
              - mem_current_project
